              - s2i-openstack-container-consumer-smoke

- project-template:
    name: opendev-nova-edpm-pipeline
    # Operator images from openstack-k8s-operators-content-provider;
    # nova/placement/cyborg service images from s2i. The old meta CP +
    # RDO centos9-master RPM path is not functional.
    openstack-experimental: &experimentalJobs
      jobs:
        - openstack-k8s-operators-content-provider:
            override-checkout: main
            required-projects:
              - github.com/openstack-k8s-operators/nova-operator
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - workloads-s2i-content-provider:
            override-checkout: main
        - nova-operator-tempest-multinode: &job_vars
            override-checkout: main
            required-projects:
              - github.com/openstack-k8s-operators/nova-operator
            vars:
              cifmw_repo_setup_branch: master
        - nova-operator-tempest-multinode-ceph: *job_vars
    experimental: *experimentalJobs
