---
- job:
    name: nova-operator-kuttl
    parent: cifmw-multinode-kuttl-operator-target
    dependencies:
      - openstack-k8s-operators-content-provider
      - workloads-s2i-content-provider
    roles:
      - zuul: github.com/openstack-k8s-operators/ci-framework
    description: |
      This job deploy a basic "Compute Starter Kit" topology
      https://www.openstack.org/software/sample-configs#compute-starter-kit
      that is the minimum set of openstack services required to boot a vm.
      Operator images come from openstack-k8s-operators-content-provider;
      nova/placement/cyborg service images come from workloads-s2i-content-provider.
    vars:
      collection_namespace_override: "nova-kuttl-tests"
      operator_name: nova-operator
      cifmw_zuul_target_host_env:
        KUTTL_SUITE: nova
      nova_repo: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/nova-operator"
      zuul_log_collection: true
      nova_hook: "{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/nova-operator'].src_dir }}/ci/nova-operator-kuttl/deploy_webhooks.yaml"
      pre_kuttl_from_operator:
        - name: 70 Create nova webhooks
          type: playbook
          source: "{{ nova_hook }}"
          extra_vars:
            nova_catalog_image: "{{ content_provider_registry_ip }}:5001/openstack-k8s-operators/nova-operator-index:{{ zuul.patchset }}"
      # Operator CP owns content_provider_registry_ip. Trust the s2i
      # registry and inject built service images during prepare.
      cifmw_crc_additional_insecure_registries:
        - "{{ s2i_content_provider_registry_ip }}:5001"
      cifmw_crc_additional_allowed_registries:
        - "{{ s2i_content_provider_registry_ip }}:5001"
      cifmw_set_containers_preserve_unlisted: true
      cifmw_set_containers_images: >-
        {{
          s2i_content_provider_os_custom_container_images | dict2items |
          json_query('[].{name: key, full_registry: value}')
        }}
    extra-vars:
      crc_ci_bootstrap_networking:
        networks:
          default:
            range: 192.168.122.0/24
            mtu: 1500
          internal-api:
            vlan: 20
            range: 172.17.0.0/24
          storage:
            vlan: 21
            range: 172.18.0.0/24
          tenant:
            vlan: 22
            range: 172.19.0.0/24
        instances:
          controller:
            networks:
              default:
                ip: 192.168.122.11
          crc:
            networks:
              default:
                ip: 192.168.122.10
              internal-api:
                ip: 172.17.0.5
              storage:
                ip: 172.18.0.5
              tenant:
                ip: 172.19.0.5
- job:
    name: nova-operator-kuttl-placement
    parent: nova-operator-kuttl
    description: |
      Run placement kuttl test suite in nova-operator
    vars:
      collection_namespace_override: "placement-kuttl-tests"
      cifmw_zuul_target_host_env:
        KUTTL_SUITE: placement
- job:
    name: nova-operator-tempest-multinode
    parent: s2i-test-base
    # Pin the nodeset on the job so every consumer inherits it, including
    # cyborg (via parent) and the s2i-component-jobs template.
    nodeset: centos-10-medium-2x-centos-10-crc-cloud-ocp-4-22-1-3xl
    dependencies:
      - openstack-k8s-operators-content-provider
      - workloads-s2i-content-provider
    required-projects:
      - name: openstack-k8s-operators/cinder-operator
    vars:
      cifmw_extras:
        - "@scenarios/centos-10/base.yml"
        - "@scenarios/centos-10/multinode-ci.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/nova-operator'].src_dir }}/ci/nova-operator-tempest-multinode/ci_fw_vars.yaml"
      cifmw_run_test_role: test_operator
      cifmw_test_operator_tempest_concurrency: 4
      cifmw_test_operator_timeout: 7200
      cifmw_test_operator_tempest_network_attachments:
        - ctlplane
      # The test_operator default is the antelope openstack-tempest-extras
      # image, which would test a 2026.2 deploy with antelope tempest.
      # Pin the s2i master tempest image instead. nova's tests
      # (tempest.api.compute, tempest.scenario) live in the base
      # openstack-tempest image; -extras is not published in the s2i org.
      cifmw_test_operator_tempest_registry: quay.io
      cifmw_test_operator_tempest_namespace: openstack-s2i-containers
      cifmw_test_operator_tempest_image_tag: master-latest
      cifmw_test_operator_tempest_container: openstack-tempest
      # avoid using default test_operator exclude list
      cifmw_test_operator_tempest_tests_exclude_override_scenario: false
      # NOTE(gibi): identity.v3_endpoint_type override is a WA to force the
      # publicURL as otherwise tempest gets configured with adminURL and that
      # causes test instability.
      # Cinder is enabled with an NFS backend; Swift remains unavailable.
      # TODO(sean-k-mooney): we are currently using cirros 0.5.2 we should be using 0.6.2
      # for now we need to use the old password cubswin:) but we should update this to gocubsgo!
      # once we update the image
      cifmw_test_operator_tempest_tempestconf_config:
          overrides: |
            identity.v3_endpoint_type public
            compute-feature-enabled.vnc_console true
            compute-feature-enabled.stable_rescue true
            compute-feature-enabled.hostname_fqdn_sanitization true
            compute-feature-enabled.live_migration true
            compute-feature-enabled.live_migrate_back_and_forth true
            compute-feature-enabled.block_migration_for_live_migration true
            compute-feature-enabled.ide_bus false
            compute-feature-enabled.attach_encrypted_volume false
            compute-feature-enabled.volume_multiattach false
            volume.storage_protocol 'nfs'
            service_available.swift false
            service_available.cinder true
            validation.image_ssh_user cirros
            validation.image_ssh_password cubswin:)
            validation.image_alt_ssh_user cirros
            validation.image_alt_ssh_password cubswin:)
            validation.allowed_network_downtime 10
      cifmw_test_operator_tempest_include_list: |
          tempest.api.compute
          tempest.scenario
      # ide tests cannot be used with our default machine type.
      # test_live_block_migration_paused is currently blocked by
      # https://issues.redhat.com/browse/RHEL-33754
      cifmw_test_operator_tempest_exclude_list: |
          test_live_block_migration_paused
          tempest.scenario.test_encrypted_cinder_volumes
          tempest.scenario.test_volume_backup_restore
          tempest.scenario.test_volume_migrate_attached
          tempest.scenario.test_server_volume_attachment.TestServerVolumeAttachmentScenario.test_server_detach_rules
          tempest.scenario.test_server_volume_attachment.TestServerVolumeAttachScenarioOldVersion.test_old_versions_reject
      # We need to use a custom cpu model to allow live migrating between
      # slightly different computes coming from the node pool
      cifmw_edpm_deploy_nova_compute_extra_config: |
        [libvirt]
        cpu_mode = custom
        cpu_models = Nehalem

- job:
    name: nova-operator-cyborg-tempest-multinode
    parent: nova-operator-tempest-multinode
    vars:
      cifmw_extras:
        - "@scenarios/centos-10/base.yml"
        - "@scenarios/centos-10/multinode-ci.yml"
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/nova-operator'].src_dir }}/ci/nova-operator-cyborg-tempest-multinode/ci_fw_vars.yaml"
      # The s2i master tempest image is inherited from
      # nova-operator-tempest-multinode.
      # Pin cyborg tempest plugin as newer commits require roles that are not created in RHOSO18
      cifmw_test_operator_tempest_external_plugin:
        - repository: https://opendev.org/openstack/cyborg-tempest-plugin.git
          changeRepository: "https://review.opendev.org/openstack/cyborg-tempest-plugin"
          changeRefspec: "e98dfff4bacdaeffe1fa79d3cfd5f2e28002cd98"
      cifmw_test_operator_tempest_include_list: |
          cyborg_tempest_plugin
      cifmw_test_operator_tempest_tempestconf_config:
          overrides: |
            identity.v3_endpoint_type public
            compute-feature-enabled.vnc_console true
            compute-feature-enabled.stable_rescue true
            compute-feature-enabled.hostname_fqdn_sanitization true
            compute-feature-enabled.live_migration true
            compute-feature-enabled.live_migrate_back_and_forth true
            compute-feature-enabled.block_migration_for_live_migration true
            compute-feature-enabled.ide_bus false
            service_available.swift false
            service_available.cinder false
            validation.image_ssh_user cirros
            validation.image_ssh_password cubswin:)
            validation.image_alt_ssh_user cirros
            validation.image_alt_ssh_password cubswin:)
            validation.allowed_network_downtime 10
            cyborg_pci.device_profile_name pci-sim-cyborg-dp
            cyborg_pci.vendor_id 1d55
            cyborg_pci.product_id 1000

- job:
    name: nova-operator-tempest-multinode-ceph
    parent: s2i-test-base-ceph
    dependencies:
      - openstack-k8s-operators-content-provider
      - workloads-s2i-content-provider
    # Note:  When inheriting from a job (or creating a variant of a job) vars are merged with previous definitions
    vars:
      s2i_extras:
        - "@{{ ansible_user_dir }}/{{ zuul.projects['github.com/openstack-k8s-operators/nova-operator'].src_dir }}/ci/nova-operator-tempest-multinode-ceph/ci_fw_vars.yaml"
      # dedupe this later
      cifmw_run_test_role: test_operator
      cifmw_test_operator_tempest_concurrency: 4
      cifmw_test_operator_timeout: 7200
      cifmw_test_operator_tempest_network_attachments:
        - ctlplane
      # The test_operator default is the antelope openstack-tempest-extras
      # image, which would test a 2026.2 deploy with antelope tempest.
      # Pin the s2i master tempest image instead. nova's tests
      # (tempest.api.compute, tempest.scenario) live in the base
      # openstack-tempest image; -extras is not published in the s2i org.
      cifmw_test_operator_tempest_registry: quay.io
      cifmw_test_operator_tempest_namespace: openstack-s2i-containers
      cifmw_test_operator_tempest_image_tag: master-latest
      cifmw_test_operator_tempest_container: openstack-tempest
      # NOTE(gibi): identity.v3_endpoint_type override is a WA to force the
      # publicURL as otherwise tempest gets configured with adminURL and that
      # causes test instability.
      # TODO(sean-k-mooney): we are currently using cirros 0.5.2 we should be using 0.6.2
      # for now we need to use the old password cubswin:) but we should update this to gocubsgo!
      # once we update the image
      # s2i-test-base-ceph is 1comp HCI, so live migration cannot run.
      cifmw_test_operator_tempest_tempestconf_config:
          overrides: |
            identity.v3_endpoint_type public
            compute-feature-enabled.vnc_console true
            compute-feature-enabled.stable_rescue true
            compute-feature-enabled.hostname_fqdn_sanitization true
            compute-feature-enabled.live_migration false
            compute-feature-enabled.ide_bus false
            compute-feature-enabled.volume_backed_live_migration false
            compute-feature-enabled.volume_multiattach true
            volume.volume_type_multiattach multiattach
            volume.storage_protocol ceph
            service_available.swift false
            service_available.cinder true
            validation.image_ssh_user cirros
            validation.image_ssh_password cubswin:)
            validation.image_alt_ssh_user cirros
            validation.image_alt_ssh_password cubswin:)
            validation.allowed_network_downtime 10
      cifmw_test_operator_tempest_include_list: |
          tempest.api.compute
          tempest.scenario
      # ide tests cannot be used with our default machine type.
      # test_server_detach_rules and test_old_versions_reject are blocked by the requirement
      # to use service tokens to authenticate with cinder when a volume is attached to a server
      # as such the tests are not valid following CVE-2023-2088
      # test_encrypted_cinder_volumes_cryptsetup use encryption format plain which is either
      # not supported by ceph or a volume type that supports it is not available.
      # luks support is enabled and we are testing encrypted volumes with luks.
      # tempest.scenario.test_network_v6 is disabled as it is 8 slow test case
      # that does not cover nova functionality. Also we keep running it in
      # the non ceph job.
      cifmw_test_operator_tempest_exclude_list: |
          tempest.scenario.test_server_volume_attachment.TestServerVolumeAttachmentScenario.test_server_detach_rules
          tempest.scenario.test_server_volume_attachment.TestServerVolumeAttachScenarioOldVersion.test_old_versions_reject
          tempest.scenario.test_encrypted_cinder_volumes.TestEncryptedCinderVolumes.test_encrypted_cinder_volumes_cryptsetup
          tempest.scenario.test_network_v6
      # We need to use a custom cpu model to allow live migrating between
      # slightly different computes coming from the node pool
      # for ceph i might need to add https://github.com/openstack-k8s-operators/docs/blob/main/ceph.md#configure-nova
      # but if i do i can just add that here as i dont know what the fsid will be
      cifmw_edpm_deploy_nova_compute_extra_config: |
        [libvirt]
        cpu_mode = custom
        cpu_models = Nehalem

- job:
    name: workloads-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i nova, placement, and cyborg service images for
      nova-operator kuttl and tempest jobs. Operator images come from
      openstack-k8s-operators-content-provider.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - nova/nova-api
        - nova/nova-compute
        - nova/nova-conductor
        - nova/nova-novncproxy
        - nova/nova-scheduler
        - placement/placement-api
        - cyborg/cyborg
        - cyborg/cyborg-agent

- project:
    name: openstack-k8s-operators/nova-operator
    default-branch: main
    merge-mode: rebase
    github-check:
      jobs:
        # Operator images only. Nova, placement, and cyborg service
        # images come from workloads-s2i-content-provider.
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - workloads-s2i-content-provider
        - nova-operator-kuttl
        - nova-operator-kuttl-placement
        - nova-operator-tempest-multinode
        - nova-operator-tempest-multinode-ceph:
            nodeset: centos-10-medium-centos-10-crc-cloud-ocp-4-22-1-3xl
        - nova-operator-cyborg-tempest-multinode:
            voting: false
            files:
              - ^api/cyborg/
              - ^internal/cyborg/
              - ^internal/controller/cyborg/
              - ^internal/webhook/cyborg/
              - ^templates/cyborg/
              - ^config/samples/cyborg.*
              - ^api/bases/cyborg\.openstack\.org.*
              - ^test/functional/cyborg/
              - ^test/kuttl/test-suites/default/cyborg-tests/
              - ^ci/nova-operator-cyborg-tempest-multinode/
              - ^go\.mod$
              - ^go\.sum$
              - ^go\.work.*
              - ^api/go\.mod$
              - ^api/go\.sum$

- pragma:
    implied-branch-matchers: True
    implied-branches:
      - main
      - master

##########################################################
#                                                        #
#               Project Template                         #
#                                                        #
##########################################################

- project-template:
    name: nova-operator-s2i-component-jobs
    description: |
      Project template to be used in the s2i-openstack-containers
      repository to validate container changes impacting Nova,
      Placement, and Cyborg.
    github-check:
      jobs:
        - nova-operator-tempest-multinode:
            required-projects:
              - name: openstack-k8s-operators/s2i-openstack-containers
                override-checkout: main
              - name: openstack-k8s-operators/nova-operator
                override-checkout: main
            vars:
              content_provider_registry_ip: '{{ s2i_content_provider_registry_ip }}'
              # Whitebox runs only for s2i consumers of this template.
              # A workflow replaces the single tempest run, so the first step
              # repeats the job's compute/scenario selection.
              cifmw_test_operator_tempest_ssh_key_secret_name: dataplane-ansible-ssh-private-key-secret
              cifmw_test_operator_tempest_tempestconf_config:
                overrides: |
                  identity.v3_endpoint_type public
                  compute-feature-enabled.vnc_console true
                  compute-feature-enabled.stable_rescue true
                  compute-feature-enabled.hostname_fqdn_sanitization true
                  compute-feature-enabled.live_migration true
                  compute-feature-enabled.live_migrate_back_and_forth true
                  compute-feature-enabled.block_migration_for_live_migration true
                  compute-feature-enabled.ide_bus false
                  service_available.swift false
                  service_available.cinder false
                  validation.image_ssh_user cirros
                  validation.image_ssh_password cubswin:)
                  validation.image_alt_ssh_user cirros
                  validation.image_alt_ssh_password cubswin:)
                  validation.allowed_network_downtime 10
                  whitebox.nodes_yaml '/etc/test_operator/whitebox_node_yaml'
                  whitebox.ctlplane_addresses compute-0.ctlplane.example.com:192.168.122.100,compute-1.ctlplane.example.com:192.168.122.101
                  whitebox.ctlplane_ssh_username cloud-admin
                  whitebox.ctlplane_ssh_private_key_path '/var/lib/tempest/.ssh/id_ecdsa'
                  whitebox.max_compute_nodes 2
                  whitebox.cpu_model Nehalem
                  whitebox.selinux_label 'system_u:system_r:svirt_t:s0'
                  whitebox.selinux_imagelabel 'system_u:object_r:svirt_image_t:s0'
                  whitebox-nova-compute.journalctl_unit edpm_nova_compute
                  whitebox-database.host openstack-cell1-galera
                  whitebox-database.user root
              cifmw_test_operator_tempest_config_overwrite:
                whitebox_node_yaml: |
                  compute-0.ctlplane.example.com:
                    services:
                      libvirt:
                        container_name: nova_virtqemud
                        start_command: 'systemctl start virtqemud'
                        stop_command: 'systemctl stop virtqemud'
                      nova-compute:
                        config_path: '/var/lib/openstack/nova/25-nova-extra.conf'
                        start_command: 'systemctl start edpm_nova_compute'
                        stop_command: 'systemctl stop edpm_nova_compute'
                  compute-1.ctlplane.example.com:
                    services:
                      libvirt:
                        container_name: nova_virtqemud
                        start_command: 'systemctl start virtqemud'
                        stop_command: 'systemctl stop virtqemud'
                      nova-compute:
                        config_path: '/var/lib/openstack/nova/25-nova-extra.conf'
                        start_command: 'systemctl start edpm_nova_compute'
                        stop_command: 'systemctl stop edpm_nova_compute'
              cifmw_test_operator_tempest_workflow:
                - stepName: tempest
                  tempestRun:
                    includeList: |
                      tempest.api.compute
                      tempest.scenario
                    excludeList: |
                      test_live_block_migration_paused
                - stepName: whitebox
                  tempestRun:
                    concurrency: 1
                    externalPlugin:
                      - repository: https://opendev.org/openstack/whitebox-tempest-plugin.git
                    includeList: |
                      whitebox_tempest_plugin.api.
                    # Pinning and provider.yaml are not configured. Cinder is off,
                    # so the volume evacuation and encryption cases error instead
                    # of skipping. The watchdog case is excluded in RHOSO 18.
                    excludeList: |
                      whitebox_tempest_plugin.api.compute.test_live_migration.LiveMigrationBase.test_live_migrate_and_reboot
                      whitebox_tempest_plugin.api.compute.test_cpu_pinning.CPUThreadPolicyTest.test_threads_isolate
                      whitebox_tempest_plugin.api.compute.test_watchdog_devices.WatchdogDeviceTest.test_action_with_flavor_5_disabled
                      whitebox_tempest_plugin.api.compute.test_provider_yaml.TestProviderYamlViaTraits.test_valid_trait_with_provider_yaml
                      whitebox_tempest_plugin.api.compute.test_server_evacuation.ServerEvacuation.test_evacuate_attached_vol
                      whitebox_tempest_plugin.api.compute.test_server_evacuation.ServerEvacuation.test_evacuate_bfv_server
                      whitebox_tempest_plugin.api.compute.test_volume_encryption.TestQEMUVolumeEncryption.test_qemu_volume_encryption
            files:
              - ^containers/nova/
              - ^containers/placement/
              - ^containers/base/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke
        - nova-operator-tempest-multinode-ceph:
            required-projects:
              - name: openstack-k8s-operators/s2i-openstack-containers
                override-checkout: main
              - name: openstack-k8s-operators/nova-operator
                override-checkout: main
            vars:
              content_provider_registry_ip: '{{ s2i_content_provider_registry_ip }}'
              # Same s2i-only whitebox step as the non-Ceph job. This job is
              # 1-compute HCI, so the host map has compute-0 only.
              cifmw_test_operator_tempest_ssh_key_secret_name: dataplane-ansible-ssh-private-key-secret
              cifmw_test_operator_tempest_tempestconf_config:
                overrides: |
                  identity.v3_endpoint_type public
                  compute-feature-enabled.vnc_console true
                  compute-feature-enabled.stable_rescue true
                  compute-feature-enabled.hostname_fqdn_sanitization true
                  compute-feature-enabled.live_migration false
                  compute-feature-enabled.ide_bus false
                  compute-feature-enabled.volume_backed_live_migration false
                  compute-feature-enabled.volume_multiattach true
                  volume.volume_type_multiattach multiattach
                  volume.storage_protocol ceph
                  service_available.swift false
                  service_available.cinder true
                  validation.image_ssh_user cirros
                  validation.image_ssh_password cubswin:)
                  validation.image_alt_ssh_user cirros
                  validation.image_alt_ssh_password cubswin:)
                  validation.allowed_network_downtime 10
                  whitebox.nodes_yaml '/etc/test_operator/whitebox_node_yaml'
                  whitebox.ctlplane_addresses compute-0.ctlplane.example.com:192.168.122.100
                  whitebox.ctlplane_ssh_username cloud-admin
                  whitebox.ctlplane_ssh_private_key_path '/var/lib/tempest/.ssh/id_ecdsa'
                  whitebox.max_compute_nodes 1
                  whitebox.available_cinder_storage 15
                  whitebox.cpu_model Nehalem
                  whitebox.selinux_label 'system_u:system_r:svirt_t:s0'
                  whitebox.selinux_imagelabel 'system_u:object_r:svirt_image_t:s0'
                  whitebox-nova-compute.journalctl_unit edpm_nova_compute
                  whitebox-database.host openstack-cell1-galera
                  whitebox-database.user root
              cifmw_test_operator_tempest_config_overwrite:
                whitebox_node_yaml: |
                  compute-0.ctlplane.example.com:
                    services:
                      libvirt:
                        container_name: nova_virtqemud
                        start_command: 'systemctl start virtqemud'
                        stop_command: 'systemctl stop virtqemud'
                      nova-compute:
                        config_path: '/var/lib/openstack/nova/25-nova-extra.conf'
                        start_command: 'systemctl start edpm_nova_compute'
                        stop_command: 'systemctl stop edpm_nova_compute'
              cifmw_test_operator_tempest_workflow:
                - stepName: tempest
                  tempestRun:
                    includeList: |
                      tempest.api.compute
                      tempest.scenario
                    excludeList: |
                      tempest.scenario.test_server_volume_attachment.TestServerVolumeAttachmentScenario.test_server_detach_rules
                      tempest.scenario.test_server_volume_attachment.TestServerVolumeAttachScenarioOldVersion.test_old_versions_reject
                      tempest.scenario.test_encrypted_cinder_volumes.TestEncryptedCinderVolumes.test_encrypted_cinder_volumes_cryptsetup
                      tempest.scenario.test_network_v6
                - stepName: whitebox
                  tempestRun:
                    concurrency: 1
                    externalPlugin:
                      - repository: https://opendev.org/openstack/whitebox-tempest-plugin.git
                    includeList: |
                      whitebox_tempest_plugin.api.
                    # Cinder is enabled
                    # This job has one compute and no CPU pinning, so the
                    # dedicated-CPU and live-migration cases fail instead of skipping.
                    excludeList: |
                      whitebox_tempest_plugin.api.compute.test_volume_negative.VolumesAdminNegativeTest.test_detach_failure
                      whitebox_tempest_plugin.api.compute.test_volume_encryption.TestQEMUVolumeEncryption.test_qemu_volume_encryption
                      whitebox_tempest_plugin.api.compute.test_cpu_pinning.CPUThreadPolicyTest.test_threads_isolate
                      whitebox_tempest_plugin.api.compute.test_watchdog_devices.WatchdogDeviceTest.test_action_with_flavor_5_disabled
                      whitebox_tempest_plugin.api.compute.test_default_hyperv_enlightenments.HyperVEnlightenments.test_live_migrate_with_enlightenments
                      whitebox_tempest_plugin.api.compute.test_validate_selinux_labels.SelinuxLabelsTest.test_live_migrate_with_label_check
            files:
              - ^containers/nova/
              - ^containers/placement/
              - ^containers/base/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke
        - nova-operator-cyborg-tempest-multinode:
            voting: false
            required-projects:
