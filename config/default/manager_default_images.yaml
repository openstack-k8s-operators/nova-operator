# This patch inject custom ENV settings to the manager container
# Used to set our default image locations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: RELATED_IMAGE_NOVA_API_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-nova-api:master-latest
        - name: RELATED_IMAGE_NOVA_CONDUCTOR_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-nova-conductor:master-latest
        - name: RELATED_IMAGE_NOVA_NOVNC_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-nova-novncproxy:master-latest
        - name: RELATED_IMAGE_NOVA_SCHEDULER_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-nova-scheduler:master-latest
        - name: RELATED_IMAGE_NOVA_COMPUTE_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-nova-compute:master-latest
        - name: RELATED_IMAGE_PLACEMENT_API_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-placement-api:master-latest
        - name: RELATED_IMAGE_CYBORG_API_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-cyborg:master-latest
        - name: RELATED_IMAGE_CYBORG_CONDUCTOR_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-cyborg:master-latest
        - name: RELATED_IMAGE_CYBORG_AGENT_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-cyborg-agent:master-latest
