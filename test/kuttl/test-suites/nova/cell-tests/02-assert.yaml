apiVersion: nova.openstack.org/v1beta1
kind: Nova
metadata:
  finalizers:
  - openstack.org/nova
  name: nova-kuttl
  namespace: nova-kuttl-tests
status:
  apiServiceReadyCount: 1
  metadataServiceReadyCount: 1
  schedulerServiceReadyCount: 1
  conditions:
  - message: Setup complete
    reason: Ready
    status: "True"
    type: Ready
  - message: Input data complete
    reason: Ready
    status: "True"
    type: InputReady
  - message: Setup complete
    reason: Ready
    status: "True"
    type: KeystoneServiceReady
  - message: MariaDBAccount creation complete
    reason: Ready
    status: "True"
    type: MariaDBAccountReady
  - message: ' Memcached instance has been provisioned'
    reason: Ready
    status: "True"
    type: MemcachedReady
  - message: DB create completed
    reason: Ready
    status: "True"
    type: NovaAPIDBReady
  - message: API message bus creation successfully
    reason: Ready
    status: "True"
    type: NovaAPIMQReady
  - message: Setup complete
    reason: Ready
    status: "True"
    type: NovaAPIReady
  - message: All DBs created successfully
    reason: Ready
    status: "True"
    type: NovaAllCellDBReady
  - message: All NovaCells are ready
    reason: Ready
    status: "True"
    type: NovaAllCellReady
  - message: All message buses created successfully
    reason: Ready
    status: "True"
    type: NovaAllCellsMQReady
  - message: There is no more NovaCells to delete
    reason: Ready
    status: "True"
    type: NovaCellsDeletion
  - message: Setup complete
    reason: Ready
    status: "True"
    type: NovaMetadataReady
  - message: Setup complete
    reason: Ready
    status: "True"
    type: NovaSchedulerReady
  - message: RoleBinding created
    reason: Ready
    status: "True"
    type: RoleBindingReady
  - message: Role created
    reason: Ready
    status: "True"
    type: RoleReady
  - message: ServiceAccount created
    reason: Ready
    status: "True"
    type: ServiceAccountReady
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    openshift.io/scc: nonroot-v2
  labels:
    service: nova-api
  name: nova-kuttl-api-0
spec:
  automountServiceAccountToken: false
status:
  containerStatuses:
  - name: nova-kuttl-api-api
    ready: true
    started: true
  - name: nova-kuttl-api-log
    ready: true
    started: true
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    openshift.io/scc: nonroot-v2
  labels:
    service: nova-metadata
    statefulset.kubernetes.io/pod-name: nova-kuttl-metadata-0
  name: nova-kuttl-metadata-0
  ownerReferences:
  - apiVersion: apps/v1
    blockOwnerDeletion: true
    controller: true
    kind: StatefulSet
    name: nova-kuttl-metadata
spec:
  automountServiceAccountToken: false
status:
  containerStatuses:
  - name: nova-kuttl-metadata-log
    ready: true
    started: true
  - name: nova-kuttl-metadata-metadata
    ready: true
    started: true

---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
  # DIAGNOSTIC (temporary): this step intermittently times out with the Nova CR
  # stuck on "NovaCells deletion in progress: cell1" because the
  # nova-kuttl-cell1-cell-delete Job's nova-manage container exits non-zero and
  # goes into CrashLoopBackOff. Its stdout is not collected by must-gather
  # (the pod is gone by the time must-gather runs), so dump it from here along
  # with the nova_api cell/host mapping state that delete_cell checks.
  # Must stay first in the list: kuttl skips the remaining commands once one
  # fails. Throttled to once every 30s and always exits 0 so it never changes
  # the assert outcome.
  - script: |
      set +e
      NS=nova-kuttl-tests
      STAMP=/tmp/kuttl-cell-delete-diag.stamp
      now=$(date +%s)
      last=$(cat "${STAMP}" 2>/dev/null || echo 0)
      if [ $((now - last)) -lt 30 ]; then
        exit 0
      fi
      echo "${now}" > "${STAMP}"

      echo "===== DIAG: cell-delete job ====="
      oc get -n "${NS}" job/nova-kuttl-cell1-cell-delete -o wide
      oc get -n "${NS}" pods -l job-name=nova-kuttl-cell1-cell-delete
      for p in $(oc get -n "${NS}" pods -l job-name=nova-kuttl-cell1-cell-delete -o name); do
        echo "--- ${p} current"
        oc logs -n "${NS}" "${p}" --all-containers --tail=60
        echo "--- ${p} previous"
        oc logs -n "${NS}" "${p}" --all-containers --previous --tail=60
        echo "--- ${p} state"
        oc get -n "${NS}" "${p}" -o jsonpath='{range .status.containerStatuses[*]}{.name}{" restarts="}{.restartCount}{" last="}{.lastState}{"\n"}{end}'
      done

      echo "===== DIAG: host-discover job ====="
      for p in $(oc get -n "${NS}" pods -l job-name=nova-kuttl-cell1-host-discover -o name); do
        oc logs -n "${NS}" "${p}" --all-containers --tail=60
      done

      # delete_cell returns 2 when host mappings exist and 3 when instance
      # mappings exist, so these three tables tell us which check is tripping.
      # DbRootPassword is the literal "password" from test/kuttl/.../deps.
      echo "===== DIAG: nova_api mappings ====="
      oc exec -n "${NS}" openstack-galera-0 -c galera -- \
        env MYSQL_PWD=password mysql -uroot -t -e \
        'select uuid, name from nova_api.cell_mappings;
         select id, host, cell_id from nova_api.host_mappings;
         select count(*) as instance_mappings from nova_api.instance_mappings;'
      exit 0
  - script: |
      oc get -n nova-kuttl-tests pod/nova-kuttl-cell1-novncproxy-0 || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests pod/nova-kuttl-cell1-conductor-0 || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests NovaCell/nova-cell1 || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests MariaDBAccount/nova-cell1 || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests MariaDBDatabase/nova-cell1 || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests TransportUrl/nova-cell1-transport || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests Secret/nova-cell1 || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests Secret/nova-cell1-db-secret || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests Secret/nova-cell1-compute-config || exit 0
      exit 1
  - script: |
      oc get -n nova-kuttl-tests Secret/nova-cell1-manage-config-data || exit 0
      exit 1
  # TODO(gibi): this needs an openstack-operator change to clean up the cell1
  # cert secrets
  #- script: |
  #    oc get -n nova-kuttl-tests Secret/cert-nova-novncproxy-cell1-public-svc || exit 0
  #    exit 1
