#
# EXECUTION (from nova-operator repo root directory):
#
#  KUTTL_SUITE=placement make kuttl-test-run
#
# ASSUMPTIONS:
#
# 1. Latest version of kuttl is installed at /usr/local/bin/kubectl-kuttl
#    - wget https://github.com/kudobuilder/kuttl/releases/download/v0.11.1/kubectl-kuttl_0.11.1_linux_x86_64
#    - mv kubectl-kuttl_0.11.1_linux_x86_64 /usr/local/bin/kubectl-kuttl
#    - chmod 755 /usr/local/bin/kubectl-kuttl
# 2. An OCP 4.10+ CRC cluster with Mariadb and Keystone operators are deployed (details below using devsetup
# and install_yamls)
#    2a. CPUS=12 MEMORY=12016 make crc
#    2b. oc login -u kubeadmin -p 12345678 https://api.crc.testing:6443
#    2c. eval $(crc oc-env)
#    2d. make crc_storage
#    2e. make input
#    2f. make keystone
#    2g. make mariadb
#    2h. make keystone_deploy
#    2i. make mariadb_deploy
#    2j. start nova-operator either through install_yamls or in another
#        terminal execute 'OPERATOR_TEMPLATES=./templates make run' within root of nova-operator repo
apiVersion: kuttl.dev/v1beta1
kind: TestSuite
reportFormat: xml
reportGranularity: test
reportName: kuttl-placement-results
namespace: placement-kuttl-tests
timeout: 300
parallel: 1
skipDelete: true
testDirs:
  - test/kuttl/test-suites/placement/tests
suppress:
  - events
artifactsDir: test/kuttl/test-suites/placement/output
