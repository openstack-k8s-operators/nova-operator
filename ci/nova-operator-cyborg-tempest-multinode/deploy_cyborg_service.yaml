---
- name: Deploy Cyborg service
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: false
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  tasks:
    - name: Wait for Cyborg CR to be created
      ansible.builtin.command:
        cmd: >-
          oc get cyborg cyborg
          --namespace={{ cifmw_install_yamls_defaults['NAMESPACE'] }}
      retries: 30
      delay: 10
      register: result
      until: result.rc == 0

    - name: Wait for Cyborg CR to be ready
      ansible.builtin.command:
        cmd: >-
          oc wait cyborg cyborg
          --namespace={{ cifmw_install_yamls_defaults['NAMESPACE'] }}
          --for=condition=Ready --timeout=600s

    - name: Create cyborg-extra-config ConfigMap
      ansible.builtin.shell: |
        oc apply -f - <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: cyborg-extra-config
          namespace: {{ cifmw_install_yamls_defaults['NAMESPACE'] }}
        data:
          cyborg-agent.conf: |
            [agent]
            enabled_drivers = pci_driver,fake_driver

            [pci]
            passthrough_whitelist = {"vendor_id": "1d55", "product_id": "1000"}
        EOF
