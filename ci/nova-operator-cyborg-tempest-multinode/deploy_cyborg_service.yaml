---
- name: Deploy Cyborg service
  hosts: "{{ cifmw_target_hook_host | default('localhost') }}"
  gather_facts: false
  environment:
    KUBECONFIG: "{{ cifmw_openshift_kubeconfig }}"
    PATH: "{{ cifmw_path }}"
  tasks:
    - name: Add CyborgPassword to osp-secret
      ansible.builtin.shell: |
        oc patch secret osp-secret \
          --namespace={{ cifmw_install_yamls_defaults['NAMESPACE'] }} \
          --type merge -p '{"data":{"CyborgPassword":"'"$(oc get secret osp-secret --namespace={{ cifmw_install_yamls_defaults['NAMESPACE'] }} -o jsonpath='{.data.AdminPassword}')"'"}}'

    - name: Enable Cyborg on the OpenStackControlPlane
      ansible.builtin.shell: |
        oc patch osctlplane -n {{ cifmw_install_yamls_defaults['NAMESPACE'] }} --type merge \
          -p '{"spec":{"cyborg":{"enabled":true}}}'

    - name: Wait for Cyborg CR to be ready
      ansible.builtin.command:
        cmd: >-
          oc wait cyborg cyborg
          --namespace={{ cifmw_install_yamls_defaults['NAMESPACE'] }}
          --for=condition=Ready --timeout=600s

    - name: Create cyborg-extra-config ConfigMap
      ansible.builtin.shell: |
        oc apply -f - <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: cyborg-extra-config
          namespace: {{ cifmw_install_yamls_defaults['NAMESPACE'] }}
        data:
          cyborg-agent.conf: |
            [agent]
            enabled_drivers = pci_driver,fake_driver

            [pci]
            passthrough_whitelist = {"vendor_id": "1d55", "product_id": "1000"}
        EOF
